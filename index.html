<!DOCTYPE html>
<html lang="en">
    <head>
       <link rel="stylesheet" type="text/css" href="style.css">
       <meta charset="utf-8"> 
    </head>
    <body>
        <div class="info">
            <h1>NFL Stats Finder</h1>
            <p>Enter in a player name in the format of firstname-lastname (lowercased)</p>
            <p>ex. puka-nacua. After the players fantasy football stats will be retrived.</p>
            <p>Also a heads up that it can only retrive the top 100 players.</p>

            <input type = "text" id="slug">
            <button onclick="getStats()">Generate </button>
            
            <p id="name"></p>
            <p id="team"></p>
            <p id="position"></p>
            <p id="rank"></p>

        </div>
        <script src="script.js"></script>
    </body>
</html>
